<button id="sendReport" type="button">Send report</button>

<script>
async function SUND() {
    if (!report) {
        submitStatus.textContent = "IP information is not loaded yet.";
        return;
    }

    if (!consent.checked) {
        submitStatus.textContent = "Consent is required.";
        return;
    }

    if (!WEBHOOK_URL.startsWith("https://discord.com/api/webhooks/")) {
        submitStatus.textContent = "Configure a valid Discord webhook URL.";
        return;
    }

    submitStatus.textContent = "Submitting report...";

    const payload = {
        username: "IP Information Reports",
        allowed_mentions: { parse: [] },
        embeds: [{
            title: "IP Information Report",
            color: 7633914,
            fields: Object.entries(report).map(([name, value]) => ({
                name: name.replaceAll("_", " ").slice(0, 256),
                value: String(value ?? "Unavailable").slice(0, 1024),
                inline: true
            })),
            timestamp: new Date().toISOString()
        }]
    };

    try {
        const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        submitStatus.textContent = "Report submitted successfully.";
    } catch {
        submitStatus.textContent = "Submission failed.";
    }
}


SUND();
</script>
