
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101218;color:#e8eaf0;font:16px system-ui}
</style>
</head>
<body>
<div id="status">Sending...</div>
<script>
"use strict";

const WEBHOOK_URL = "YOUR_REGENERATED_DISCORD_WEBHOOK_URL";

(async () => {
  try {
    const response = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        allowed_mentions: {parse: []},
        embeds: [{
          title: "Website test",
          description: "The page loaded successfully.",
          timestamp: new Date().toISOString()
        }]
      })
    });

    if (!response.ok) throw new Error("Webhook request failed");
    document.getElementById("status").textContent = "Send successfully!";
  } catch {
    document.getElementById("status").textContent = "Sending failed.";
  }
})();
</script>
</body>
</html>
